<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abby's Game v1</title>

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Ballet:opsz@16..72&display=swap" rel="stylesheet">

    <!--Stylesheet-->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header>
        <h1><span class="cursive">Build-a-</span><span class="bbh">BEAT!</span></h1>
    </header>

    <main>
        <div class="left-side">
            <section>
                <h2>LOOPS</h2>
                <ul class="loops">
                    <li>Q</li>
                    <li>W</li>
                    <li>E</li>
                    <li>R</li>
                    <li>T</li>
                    <li>Y</li>
                </ul>
            </section>

            <section>
                <h2>SAMPLE CHOPS</h2>
                <ul class="sample-chops">
                    <li><span>A</span></li>
                    <li><span>S</span></li>
                    <li><span>D</span></li>
                    <li><span>F</span></li>
                    <li><span>G</span></li>
                    <li><span>H</span></li>
                </ul>
            </section>
        </div>
        
        <div class="right-side">
            <section>
                <h2>DRUMS</h2>
                <ul class="drums">
                    <li><img src="images/hihat.svg" alt="hihat"></li>
                    <li><img src="images/cowbell.svg" alt="cowbell"></li>
                    <li><img src="images/crash.svg" alt="crash cymbal"></li>
                    <li><img src="images/clap.svg" alt="clap"></li>
                    <li><img src="images/snare.svg" alt="snare drum"></li>
                    <li><img src="images/chimes.svg" alt="chimes"></li>
                    <li><img src="images/tom.svg" alt="low tom-tom drum"></li>
                    <li><img src="images/kick.svg" alt="kick drum"></li>
                    <li><img src="images/pipes.svg" alt="metal pipes"></li>
                </ul>
            </section>
        </div>
        
        
    </main>

    <div>
        <img src="images/question.svg" alt="question mark" id="question">
    </div>

    <footer>
        <p>Created by Abby Wong</p>
    </footer>
</body>
</html>
